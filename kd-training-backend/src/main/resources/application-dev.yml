spring:
  jpa:
    show-sql: true
  # MailHog from kd-training-hub/docker-compose.dev.yml (web UI on localhost:8027). Without this the
  # application.yml default, smtp.gmail.com, applied in dev too.
  mail:
    host: localhost
    port: 1027
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  site-url: http://localhost:5175
  jwt:
    secret: dev-secret-key-change-in-production-minimum-32-characters

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    pl.kdtraining: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
