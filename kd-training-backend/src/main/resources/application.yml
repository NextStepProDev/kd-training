spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: kd-training
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:kdtraining}
    username: ${DB_USER:kdtraining}
    password: ${DB_PASSWORD:kdtraining_dev}
    hikari:
      # Each connection is a Postgres backend process sharing the same ~1 GB box; traffic is tiny.
      # Raise only when HikariCP metrics actually show pool saturation.
      maximum-pool-size: ${HIKARI_MAX_POOL:8}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      keepalive-time: 120000
      max-lifetime: 1200000
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC
          batch_size: 25
        default_batch_fetch_size: 16
        order_inserts: true
        order_updates: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
app:
  version: '@version@'
  storage:
    root: ${STORAGE_ROOT:./uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    # Technical/developer accounts (CSV) — they hold admin for testing but stay hidden from the
    # user list in the panel, from admin-add search, and from bulk mail recipients.
    hidden-emails: ${ADMIN_HIDDEN_EMAILS:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@kdtraining.example}}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*}
  base-url: ${APP_BASE_URL:http://localhost:8083}
  site-url: ${SITE_URL:http://localhost:5175}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: kdtraining.example

server:
  port: 8083
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # A slow SMTP probe (~10 s) overruns the docker healthcheck timeout (5 s) → a false "unhealthy"
    # → a pointless restart. Mail is not liveness-critical, so it stays out of /actuator/health.
    mail:
      enabled: false

logging:
  level:
    pl.kdtraining: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
