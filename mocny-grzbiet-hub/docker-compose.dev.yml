services:
  postgres:
    image: postgres:18-alpine
    container_name: mg-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mocnygrzbiet}
      POSTGRES_USER: ${POSTGRES_USER:-mocnygrzbiet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mocnygrzbiet_dev}
    ports:
      - "5436:5432"
    volumes:
      - mg_postgres_data_dev_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mocnygrzbiet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mg-mailhog-dev
    ports:
      - "1027:1025"
      - "8027:8025"

volumes:
  mg_postgres_data_dev_v18:
